apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: app1
  name: app1
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
      - image: wil42/playground:v2
        name: playground
        ports:
        - containerPort: 8888

---

apiVersion: v1
kind: Service
metadata:
  name: app1-service
  namespace: dev
spec:
  type: NodePort
  selector:
    app: app1
  ports:
  - port: 8888
    targetPort: 8888
    nodePort: 30000